name: CI

# Every push to main and every pull request; also called by release.yml, so a
# tag is only built from a commit that passes exactly these checks.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch makes an older run pointless.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONFAULTHANDLER: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Ruff (version pinned in requirements-dev.txt)
        run: |
          pip install "$(grep -E '^ruff==' requirements-dev.txt)"
          ruff check .

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Known vulnerabilities in what ships (runtime and build)
        run: |
          pip install "$(grep -E '^pip-audit==' requirements-dev.txt)"
          pip-audit -r requirements-build.txt

  test-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: System libraries for Qt, OpenGL and the X server
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libglu1-mesa libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libdbus-1-3 \
            fonts-liberation
      - run: pip install -r requirements-dev.txt
      - name: Unit and integration tests
        run: python -m pytest -m "not slow" -q -o faulthandler_timeout=600
      - name: Self-test
        run: python -m simplecad --self-test
      - name: Real-window checks (Xvfb)
        env:
          SIMPLECAD_SHOTS_DIR: ${{ runner.temp }}/shots
        run: |
          mkdir -p "$SIMPLECAD_SHOTS_DIR"
          xvfb-run -a -s "-screen 0 1600x1000x24" python -m pytest -m gui -q -rA
      - name: Keep the real-window screenshots when a check fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-check-shots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  test-other:
    # The geometry kernel, file format, transforms, Align & Arrange, the shell
    # and the updater, headless. The 3D viewport on these systems is not drawn
    # in CI; see docs/specs/packaging.md.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m simplecad --self-test
      - run: >
          python -m pytest -q -m "not slow" -o faulthandler_timeout=600
          tests/test_transform_constraints.py tests/test_gizmo_v030.py
          tests/test_align_arrange_v030.py tests/test_shell_v030.py tests/test_ui_theme.py
          tests/test_scenarios.py tests/test_joints_sliding.py tests/test_hinge.py
          tests/test_updates.py tests/test_project.py tests/test_operations.py
          tests/test_document.py tests/test_history.py tests/test_split.py
          tests/test_settings.py

  viewport-other:
    # Experimental (v0.3.0): does the real 3D view draw and take a gizmo drag
    # on Windows and macOS? Allowed to fail: until it has passed reliably, a
    # failure here is information, not a broken build. Windows runners have no
    # usable OpenGL, so Mesa's software renderer (llvmpipe) stands in.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: true
    env:
      MESA_VERSION: "26.2.5"
      MESA_SHA256: 997123ef4ce8896204ab912d5b54f19372c487ff9835bcefafa2fca23b8953c2
      SIMPLECAD_NO_RECOVERY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Software OpenGL for the Windows runner (Mesa llvmpipe, checksum-verified)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/mesa3d-$env:MESA_VERSION-release-msvc.7z"
          Invoke-WebRequest $url -OutFile mesa.7z
          $hash = (Get-FileHash mesa.7z -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:MESA_SHA256) { throw "Mesa checksum mismatch: $hash" }
          7z x mesa.7z -omesa | Out-Null
          $python = Split-Path (Get-Command python).Source
          Copy-Item mesa\x64\*.dll $python
          "GALLIUM_DRIVER=llvmpipe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: A gizmo drag in a real window
        shell: bash
        env:
          SIMPLECAD_SHOTS_DIR: ${{ runner.temp }}/shots
        run: |
          mkdir -p "$SIMPLECAD_SHOTS_DIR"
          python scripts/check_gizmo.py
      - name: Keep what the window looked like
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viewport-${{ matrix.os }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
