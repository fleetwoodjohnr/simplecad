name: Release

# Push an annotated tag like v0.3.0 (matching simplecad/__init__.py) on a commit
# that is on main. This then:
#   1. refuses a lightweight or mismatched tag, one not on main, or one that
#      already has a release (nothing is ever overwritten)
#   2. runs CI (ci.yml) in full
#   3. builds every package, installs each one and runs it (--self-test)
#   4. checks the full set of files is present, checksums and signs them
#   5. uploads them to a DRAFT release with the CHANGELOG notes
# A person reads the draft and publishes it (docs/release.md).
#
# Run by hand (Actions -> Release -> Run workflow) it is a dry run: everything
# above except the tag checks and the release itself, to prove a branch builds,
# installs and signs on every system before it is tagged.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONFAULTHANDLER: "1"
  APPIMAGETOOL_VERSION: "1.9.1"
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
  NFPM_VERSION: "2.41.1"
  NFPM_SHA256: b3cf95aa6dabed836d09ad7f0c190a13c74c5b1304db60846f0f702ee407f430
  INNOSETUP_VERSION: "6.7.1"

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The tag is annotated, matches the code, and is on main
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' simplecad/__init__.py)"
          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            grep -q "^## ${version}" CHANGELOG.md || {
              echo "::error::CHANGELOG.md has no section for ${version}"; exit 1; }
            echo "Dry run of ${version} from ${GITHUB_REF_NAME}: no tag checks, no release"
            exit 0
          fi
          if [ "v${version}" != "${tag}" ]; then
            echo "::error::tag ${tag} does not match __version__ ${version}"; exit 1
          fi
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          if [ "$(git cat-file -t "refs/tags/${tag}")" != "tag" ]; then
            echo "::error::${tag} is a lightweight tag; push an annotated one (git tag -a)"; exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${tag} points at a commit that is not on main"; exit 1
          fi
          grep -q "^## ${version}" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no section for ${version}"; exit 1; }
          echo "Releasing ${tag} from $(git rev-parse --short "${GITHUB_SHA}")"

  ci:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  build:
    needs: [preflight, ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04        # older glibc: the AppImage runs on more systems
            steps: bundle appimage deb rpm flatpak-tarball
          - os: windows-2025
            steps: bundle windows
          - os: macos-15            # Apple silicon
            steps: bundle macos
          - os: macos-15-intel      # Intel
            steps: bundle macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements-build.txt
      - name: Linux packaging tools (pinned, checksum-verified)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libfontconfig1 file
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  appimagetool" | sha256sum -c -
          chmod +x appimagetool && sudo mv appimagetool /usr/local/bin/
          curl -fsSL -o nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  nfpm.tar.gz" | sha256sum -c -
          tar xzf nfpm.tar.gz nfpm && sudo mv nfpm /usr/local/bin/
      - name: Inno Setup (pinned)
        if: runner.os == 'Windows'
        run: choco install innosetup --version=${{ env.INNOSETUP_VERSION }} -y --no-progress
      - name: Build
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"   # appimagetool without FUSE
        run: python packaging/build.py ${{ matrix.steps }}

      # -- install what was built, the way a user would, and run it -------------
      - name: Install and run the AppImage, .deb and .rpm
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euxo pipefail
          # --self-test runs headless; window_smoke.sh opens the real window
          # (QT_QPA_PLATFORM unset), which is where a build missing GL fails.
          smoke="${GITHUB_WORKSPACE}/scripts/window_smoke.sh"
          chmod +x "${smoke}"
          cd dist/release
          chmod +x SimpleCAD-*-linux-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./SimpleCAD-*-linux-x86_64.AppImage --self-test
          sudo apt-get install -y ./SimpleCAD-*-linux-x86_64.deb xvfb
          /usr/bin/simplecad --self-test
          test -s /usr/share/icons/hicolor/48x48/apps/simplecad.png
          test -s /usr/share/icons/hicolor/scalable/apps/simplecad.svg
          test -s /usr/share/metainfo/io.github.fleetwoodjohnr.SimpleCAD.metainfo.xml
          env -u QT_QPA_PLATFORM "${smoke}" deb-ubuntu-22.04 /usr/bin/simplecad
          env -u QT_QPA_PLATFORM APPIMAGE_EXTRACT_AND_RUN=1 "${smoke}" appimage-ubuntu-22.04 \
            ./SimpleCAD-*-linux-x86_64.AppImage
          sudo apt-get remove -y simplecad
          # Current distributions, whose Mesa needs a newer C++ runtime than the
          # build machine's: the .rpm (with validators that know today's keys)
          # and the AppImage on Fedora, the .deb on Ubuntu 24.04.
          docker run --rm -e QT_QPA_PLATFORM=offscreen -e LANG=C.UTF-8 -v "$PWD:/pkgs:ro" \
            -v "${smoke}:/smoke.sh:ro" fedora:44 bash -euxc '
            dnf install -y -q mesa-libGL mesa-libEGL mesa-dri-drivers libxkbcommon fontconfig \
              glib2 dbus-libs xorg-x11-server-Xvfb xorg-x11-xauth desktop-file-utils appstream
            dnf install -y -q /pkgs/SimpleCAD-*-linux-x86_64.rpm
            /usr/bin/simplecad --self-test
            env -u QT_QPA_PLATFORM /smoke.sh rpm-fedora-44 /usr/bin/simplecad
            cp /pkgs/SimpleCAD-*-linux-x86_64.AppImage /tmp/SimpleCAD.AppImage
            env -u QT_QPA_PLATFORM APPIMAGE_EXTRACT_AND_RUN=1 /smoke.sh appimage-fedora-44 \
              /tmp/SimpleCAD.AppImage
            desktop-file-validate /usr/share/applications/simplecad.desktop
            appstreamcli validate --no-net \
              /usr/share/metainfo/io.github.fleetwoodjohnr.SimpleCAD.metainfo.xml'
          docker run --rm -e QT_QPA_PLATFORM=offscreen -e LANG=C.UTF-8 \
            -e DEBIAN_FRONTEND=noninteractive -v "$PWD:/pkgs:ro" -v "${smoke}:/smoke.sh:ro" \
            ubuntu:24.04 bash -euxc '
            apt-get update -q
            apt-get install -y -q /pkgs/SimpleCAD-*-linux-x86_64.deb xvfb xauth libgl1-mesa-dri
            /usr/bin/simplecad --self-test
            env -u QT_QPA_PLATFORM /smoke.sh deb-ubuntu-24.04 /usr/bin/simplecad'
      - name: Install and run the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/release/SimpleCAD-*-windows-x86_64-setup.exe | Select-Object -First 1
          $install = Join-Path $env:RUNNER_TEMP 'SimpleCAD'
          $p = Start-Process $setup.FullName -Wait -PassThru -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$install"
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $out = Join-Path $env:RUNNER_TEMP 'self-test.txt'
          $app = Start-Process (Join-Path $install 'SimpleCAD.exe') -Wait -PassThru `
            -ArgumentList '--self-test' -RedirectStandardOutput $out
          Get-Content $out -ErrorAction SilentlyContinue
          if ($app.ExitCode -ne 0) { throw "installed SimpleCAD --self-test exited $($app.ExitCode)" }
      - name: Open the disk image and run the app from it
        if: runner.os == 'macOS'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euxo pipefail
          dmg="$(ls dist/release/SimpleCAD-*-macos-*.dmg)"
          hdiutil attach "$dmg" -mountpoint /Volumes/SimpleCADTest -nobrowse
          test -L /Volumes/SimpleCADTest/Applications
          ditto /Volumes/SimpleCADTest/SimpleCAD.app "$RUNNER_TEMP/SimpleCAD.app"
          hdiutil detach /Volumes/SimpleCADTest
          test -s "$RUNNER_TEMP/SimpleCAD.app/Contents/Resources/simplecad.icns"
          "$RUNNER_TEMP/SimpleCAD.app/Contents/MacOS/SimpleCAD" --self-test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/release/*
            build/simplecad-bundle-*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Only what signing needs
        run: pip install $(grep -E '^(cryptography|packaging)' requirements.txt)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Every package is here, and nothing else
        shell: bash
        run: |
          set -euo pipefail
          v="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' simplecad/__init__.py)"
          mkdir -p dist/release
          find artifacts -type f \( -name 'SimpleCAD-*' -o -name 'simplecad-bundle-*' \) \
            -exec cp {} dist/release/ \;
          expected=(
            "SimpleCAD-${v}-linux-x86_64.AppImage"
            "SimpleCAD-${v}-linux-x86_64.deb"
            "SimpleCAD-${v}-linux-x86_64.rpm"
            "SimpleCAD-${v}-macos-arm64.dmg"
            "SimpleCAD-${v}-macos-x86_64.dmg"
            "SimpleCAD-${v}-windows-x86_64-setup.exe"
            "simplecad-bundle-x86_64.tar.gz"
          )
          for name in "${expected[@]}"; do
            if [ ! -s "dist/release/${name}" ]; then echo "::error::missing or empty: ${name}"; exit 1; fi
          done
          found="$(ls dist/release | wc -l)"
          if [ "${found}" != "${#expected[@]}" ]; then
            echo "::error::expected ${#expected[@]} files, found ${found}:"; ls -l dist/release; exit 1
          fi
          ls -l dist/release
      - name: Checksum and sign
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          python scripts/sign_release.py dist/release
          (cd dist/release && sha256sum -c SHA256SUMS)
      - name: Notes from CHANGELOG.md
        run: |
          python scripts/release_notes.py "$(python -c 'import simplecad; print(simplecad.__version__)')" \
            > "$RUNNER_TEMP/notes.md"
          head -20 "$RUNNER_TEMP/notes.md"
      - name: Draft release (never over an existing one)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::error::a release for ${GITHUB_REF_NAME} already exists; not touching it"; exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" dist/release/* --draft --verify-tag \
            --title "SimpleCAD ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"
          uploaded="$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets | length')"
          if [ "${uploaded}" != "$(ls dist/release | wc -l)" ]; then
            echo "::error::uploaded ${uploaded} assets, expected $(ls dist/release | wc -l)"; exit 1
          fi
          echo "Draft ready: $(gh release view "${GITHUB_REF_NAME}" --json url --jq .url)"
