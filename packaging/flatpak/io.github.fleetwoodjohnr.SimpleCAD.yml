# Flatpak wrapping the PyInstaller bundle (packaging/build.py bundle flatpak-tarball).
# Not suitable for Flathub, which wants a from-source build; fine for a release
# download and for local install:
#   flatpak-builder --user --install build-flatpak packaging/flatpak/io.github.fleetwoodjohnr.SimpleCAD.yml
# Updates for a Flatpak come from Flatpak; the app only tells the user.
app-id: io.github.fleetwoodjohnr.SimpleCAD
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
command: simplecad
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --device=dri
  - --filesystem=home
modules:
  - name: simplecad
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib /app/bin
      - cp -a SimpleCAD /app/lib/simplecad
      - ln -s /app/lib/simplecad/simplecad /app/bin/simplecad
      - sed 's|SIMPLECAD_LAUNCHER|simplecad|; s|^Icon=simplecad|Icon=io.github.fleetwoodjohnr.SimpleCAD|' simplecad.desktop > io.github.fleetwoodjohnr.SimpleCAD.desktop
      - install -Dm644 io.github.fleetwoodjohnr.SimpleCAD.desktop /app/share/applications/io.github.fleetwoodjohnr.SimpleCAD.desktop
      - install -Dm644 simplecad.svg /app/share/icons/hicolor/scalable/apps/io.github.fleetwoodjohnr.SimpleCAD.svg
    sources:
      - type: archive
        path: ../../build/simplecad-bundle-x86_64.tar.gz
        strip-components: 0
      - type: file
        path: ../../simplecad.desktop
      - type: file
        path: ../../simplecad/assets/simplecad.svg
