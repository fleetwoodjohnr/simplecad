[package]
name = "scad"
description = "SimpleCAD's core: projects, and in time the document, history and features"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22.1"
gltf = { version = "=1.4.1", default-features = false, features = ["names", "utils"] }
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
occt = { path = "../occt" }
quick-xml = "0.42.0"
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v5"] }
zip = { version = "9.7.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
