[package]
name = "scad_engine"
description = "SimpleCAD's geometry engine as a Node addon, loaded in Electron's engine utility process"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"
occt = { path = "../occt" }
zip = { version = "9.7.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
napi-build = "2"
