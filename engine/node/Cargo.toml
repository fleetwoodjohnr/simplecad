[package]
name = "scad_engine"
description = "SimpleCAD's geometry engine as a Node addon, loaded in Electron's engine utility process"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"
scad_kernel = { path = "../kernel" }

[build-dependencies]
napi-build = "2"
