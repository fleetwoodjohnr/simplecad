[package]
name = "scad_engine"
description = "SimpleCAD's geometry engine as a Node addon, loaded in Electron's engine utility process"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
# No tests here, and its test binary could not start: it finds OCCT beside the
# addon ($ORIGIN), which is only so once packaged. The engine is tested in occt and scad.
test = false
doctest = false

[dependencies]
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"
occt = { path = "../occt" }
scad = { path = "../scad" }

[build-dependencies]
napi-build = "2"
