[package]
name = "occt"
description = "The OCCT operations SimpleCAD uses, behind a small C++ shim"
edition.workspace = true
version.workspace = true
publish.workspace = true
# Lets dependents read DEP_OCCT_LIB_DIR, to find the shared libraries at run time.
links = "occt"

[dependencies]
cxx = "1"

[build-dependencies]
cxx-build = "1"
