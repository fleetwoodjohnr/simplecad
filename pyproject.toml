[project]
name = "simplecad"
version = "0.3.1"
description = "Modern parametric CAD for Fedora, built for functional 3D printing"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: modelled-thread and boolean tests that take minutes (deselect with -m 'not slow')",
    "gui: needs a real GL context; run under xvfb-run with QT_QPA_PLATFORM=xcb",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
extend-exclude = ["build", "dist", ".venv", "packaging/simplecad.spec"]

[tool.ruff.lint]
# The checks that catch real bugs -- syntax errors, undefined names, misuse of
# comparisons -- rather than style. Widen deliberately, a rule at a time.
select = ["E9", "F63", "F7", "F82"]
